<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PB2 Trigger Compiler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PB2 Trigger Compiler</h1>
    <select id="examples" title="Load an example (replaces your files)"></select>
    <label title="Prefix of every variable and trigger uid; empty: from the file name">prefix <input id="prefix" size="8" placeholder="auto"></label>
    <label title="Stop a loop after this many jumps back per event; 0: no guard">guard <input id="guard" type="number" min="0" step="1000"></label>
    <label title="Frames to simulate with Run">frames <input id="frames" type="number" min="1"></label>
    <label title="Keep text such as &quot;007&quot; or &quot;0123456789.&quot; as text when the map is saved in the website editor, which turns it into a number (one more action each). Untick for other map editors."><input id="number-text" type="checkbox"> site editor</label>
    <label title="triggers: compile to triggers. pcode: compile to p-code that a fixed set of triggers runs (about 20 times slower, experimental; --target)">target <select id="target"><option value="triggers">triggers</option><option value="pcode">pcode</option></select></label>
    <label title="Read and write array elements without scanning every variable: 2 more actions each, faster in maps with many variables (--direct-index)"><input id="direct-index" type="checkbox"> direct index</label>
    <label title="Vim key bindings"><input id="vim" type="checkbox"> Vim</label>
    <button id="compile" title="Ctrl+Enter">Compile</button>
    <button id="run" title="Ctrl+Shift+Enter">Run</button>
    <input id="host-map" type="file" accept=".xml,.txt" hidden>
    <button id="host-map-button" title="A map XML downloaded from the editor: the program is appended to it">map XML…</button>
    <span id="host-map-name" class="muted">no map</span>
    <button id="environment-button" title="Values for env(&quot;NAME&quot;) in constants, one NAME=value per line. Kept only until the page is closed">env…</button>
    <div id="environment-panel" hidden>
      <label for="environment">env() values, one <code>NAME=value</code> per line. Not saved: gone when the page closes.</label>
      <textarea id="environment" rows="4" spellcheck="false" autocomplete="off" placeholder="MAP_PASSWORD=open sesame"></textarea>
    </div>
    <a href="https://github.com/0x42697262/plazma-burst-2-trigger-compiler/blob/master/docs/syntax.md" target="_blank" rel="noopener">docs</a>
  </header>
  <main>
    <section class="source">
      <nav id="tabs"></nav>
      <div id="editor"></div>
    </section>
    <section class="result">
      <nav id="output-tabs">
        <button data-output="problems" class="active">Problems</button>
        <button data-output="xml">XML</button>
        <button data-output="text">Trigger text</button>
        <button data-output="map">Map</button>
        <button data-output="run">Run</button>
        <span class="spacer"></span>
        <button id="copy">Copy</button>
        <button id="download">Download</button>
      </nav>
      <pre id="output"></pre>
      <div id="status"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
